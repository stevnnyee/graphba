services:
  db:
    image: postgres:16
    container_name: graphba-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: graphba
      POSTGRES_PASSWORD: graphba
      POSTGRES_DB: graphba
    ports:
      - "5432:5432"
    volumes:
      - graphba-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphba -d graphba"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  graphba-pgdata:
